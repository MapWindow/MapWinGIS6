name: CMake Visual Studio build

on:
  workflow_call:
    inputs:
      platform:
        required: true
        type: string
      configuration:
        required: true
        type: string

jobs:
  build:
    runs-on: windows-2025
    timeout-minutes: 180

    env:
      VCPKG_BINARY_SOURCES: 'clear;files,${{ github.workspace }}\vcpkg-binary-cache,readwrite'
      MWG_WINDOWS_SDK: '10.0'

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Compute vcpkg cache key
        id: cache_key
        shell: pwsh
        run: |
          $leg = 'vcpkg-binary-${{ runner.os }}-${{ inputs.platform }}-${{ inputs.configuration == 'Release' && 'release-full' || 'tests' }}-'
          Add-Content -Path $env:GITHUB_OUTPUT -Value "leg=$leg"
          Add-Content -Path $env:GITHUB_OUTPUT -Value "prefix=$leg$env:ImageVersion-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', 'build/triplets/*.cmake') }}-"

      - name: Restore vcpkg binary packages
        uses: actions/cache/restore@v6
        with:
          path: vcpkg-binary-cache
          key: ${{ steps.cache_key.outputs.prefix }}${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ${{ steps.cache_key.outputs.prefix }}
            ${{ steps.cache_key.outputs.leg }}

      - name: Bootstrap vcpkg
        shell: pwsh
        run: ./build/scripts/bootstrap-vcpkg.ps1 -Baseline

      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v3

      - name: Configure CMake
        shell: pwsh
        run: |
          $platform = '${{ inputs.platform }}'
          $configuration = '${{ inputs.configuration }}'
          $architecture = if ($platform -eq 'x64') { 'x64' } else { 'x86' }
          $configurePreset = "vs2026-$architecture"
          $buildPreset = "$configurePreset-$($configuration.ToLowerInvariant())"
          $toolsetVersion = (& msbuild `
            src/MapWinGIS.Core/MapWinGIS.Core.vcxproj `
            -getProperty:VCToolsVersion `
            -p:Configuration=$configuration `
            -p:Platform=$platform `
            -p:MwgWindowsSdk=$env:MWG_WINDOWS_SDK `
            -nologo | Out-String).Trim()
          if ($LASTEXITCODE -ne 0 -or $toolsetVersion -notmatch '^\d+\.\d+\.\d+$') {
            throw "Could not determine the MSVC v145 toolset version (MSBuild exit code: $LASTEXITCODE, value: '$toolsetVersion')."
          }
          $release = $configuration -eq 'Release'
          $suffix = if ($release) { '-release' } else { '' }
          $triplet = "$architecture-windows-v145$suffix"
          $hostTriplet = "x64-windows-v145$suffix"
          $installedDir = "$env:GITHUB_WORKSPACE/vcpkg_installed/cmake-$platform$suffix"
          $features = if ($release) { @('tests', 'full-drivers') } else { @('tests') }
          $vcpkg = Join-Path $env:MWG_VCPKG_ROOT 'vcpkg.exe'

          & $vcpkg install `
            "--x-manifest-root=$env:GITHUB_WORKSPACE" `
            "--x-install-root=$installedDir" `
            "--overlay-triplets=$env:GITHUB_WORKSPACE\build\triplets" `
            --triplet $triplet `
            --host-triplet $hostTriplet `
            @($features | ForEach-Object { "--x-feature=$_" }) `
            --clean-after-build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $arguments = @(
            "-DMWG_WINDOWS_SDK=$env:MWG_WINDOWS_SDK",
            "-DVCPKG_MANIFEST_FEATURES=$($features -join ';')",
            "-DVCPKG_TARGET_TRIPLET=$triplet",
            "-DVCPKG_HOST_TRIPLET=$hostTriplet",
            "-DVCPKG_INSTALLED_DIR=$installedDir",
            '-DVCPKG_MANIFEST_INSTALL=OFF'
          )
          cmake --preset $configurePreset `
            -T "v145,version=$toolsetVersion" `
            @arguments
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Add-Content -Path $env:GITHUB_ENV -Value "MWG_CMAKE_BUILD_PRESET=$buildPreset"

      - name: Build CMake preset
        shell: pwsh
        run: |
          cmake --build --preset $env:MWG_CMAKE_BUILD_PRESET --parallel
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Test CMake preset
        shell: pwsh
        run: |
          ctest --preset $env:MWG_CMAKE_BUILD_PRESET --output-on-failure -LE interactive
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: testresults-cmake-${{ inputs.platform }}-${{ inputs.configuration }}
          path: out/b/${{ inputs.platform == 'x64' && 'vs-x64' || 'vs-x86' }}/test-results/*.xml
          if-no-files-found: warn

      - name: Upload Release binaries
        if: ${{ inputs.configuration == 'Release' }}
        uses: actions/upload-artifact@v7
        with:
          name: MapWinGIS.CMake-${{ inputs.platform }}
          path: out/b/${{ inputs.platform == 'x64' && 'vs-x64' || 'vs-x86' }}/bin/Release/
          if-no-files-found: error
