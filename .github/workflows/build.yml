name: build

on:
  push:
    branches: [main, development]
  pull_request:

concurrency:
  group: build-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# vcpkg binary caches
# -------------------
# Only the vcpkg-deps jobs write caches. They save the binary cache under
# "<prefix><run_id>-<run_attempt>" after vcpkg installs dependencies.
# Consumers wait only for their matching platform and configuration leg. The
# prefix covers vcpkg.json, whose builtin-baseline pins the vcpkg checkout
# (bootstrap-vcpkg.ps1 -Baseline). Legs:
#   <platform>-tests         Debug builds: default triplet, "tests" feature.
#   <platform>-release-full  Release builds: release-only triplet,
#                            "tests" and "full-drivers" features.

jobs:
  vcpkg-deps-x64-tests:
    permissions:
      contents: read
    uses: ./.github/workflows/vcpkg-deps.yml
    with:
      leg: x64-tests

  vcpkg-deps-win32-tests:
    permissions:
      contents: read
    uses: ./.github/workflows/vcpkg-deps.yml
    with:
      leg: Win32-tests

  vcpkg-deps-x64-release-full:
    permissions:
      contents: read
    uses: ./.github/workflows/vcpkg-deps.yml
    with:
      leg: x64-release-full

  vcpkg-deps-win32-release-full:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
    uses: ./.github/workflows/vcpkg-deps.yml
    with:
      leg: Win32-release-full

  vcpkg-cache-cleanup:
    needs: [vcpkg-deps-x64-tests, vcpkg-deps-win32-tests, vcpkg-deps-x64-release-full, vcpkg-deps-win32-release-full]
    if: ${{ !cancelled() }}
    runs-on: windows-2025
    timeout-minutes: 10

    permissions:
      actions: write
      contents: read

    strategy:
      fail-fast: false
      matrix:
        leg: [x64-tests, x64-release-full, Win32-tests, Win32-release-full]

    steps:
      - name: Delete superseded vcpkg caches
        continue-on-error: true
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $leg = "vcpkg-binary-$env:RUNNER_OS-${{ matrix.leg }}-"
          $suffix = "$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          $caches = gh cache list --repo $env:GITHUB_REPOSITORY --ref $env:GITHUB_REF `
            --key $leg --limit 100 --json id,key | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $keep = @($caches | Where-Object { $_.key.EndsWith($suffix, [StringComparison]::Ordinal) })
          if ($keep.Count -eq 0) { Write-Host "No cache was saved for ${{ matrix.leg }}."; exit 0 }
          foreach ($cache in @($caches | Where-Object id -ne $keep[0].id)) {
            Write-Host "Deleting $($cache.key)"
            gh cache delete $cache.id --repo $env:GITHUB_REPOSITORY
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

  cmake-parity:
    needs: vcpkg-deps-x64-tests
    # Still build when a dependency leg failed; the job then builds what is missing.
    if: ${{ !cancelled() }}
    runs-on: windows-2025
    timeout-minutes: 180

    env:
      VCPKG_BINARY_SOURCES: 'clear;files,${{ github.workspace }}\vcpkg-binary-cache,readwrite'
      MWG_WINDOWS_SDK: '10.0'

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Compute vcpkg cache key
        id: cache_key
        shell: pwsh
        run: |
          $leg = 'vcpkg-binary-${{ runner.os }}-x64-tests-'
          Add-Content -Path $env:GITHUB_OUTPUT -Value "leg=$leg"
          Add-Content -Path $env:GITHUB_OUTPUT -Value "prefix=$leg$env:ImageVersion-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', 'build/triplets/*.cmake') }}-"

      - name: Restore vcpkg binary packages
        uses: actions/cache/restore@v6
        with:
          path: vcpkg-binary-cache
          key: ${{ steps.cache_key.outputs.prefix }}${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ${{ steps.cache_key.outputs.prefix }}
            ${{ steps.cache_key.outputs.leg }}

      - name: Bootstrap vcpkg
        shell: pwsh
        run: ./build/scripts/bootstrap-vcpkg.ps1 -Baseline

      - name: Configure CMake preset
        shell: pwsh
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $vsPath = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vsPath) { throw 'Visual Studio C++ tools were not found.' }
          $vcvars = Join-Path $vsPath 'VC\Auxiliary\Build\vcvars64.bat'
          $ninja = Join-Path $vsPath 'Common7\IDE\CommonExtensions\Microsoft\CMake\Ninja'
          $env:PATH = "$ninja;$env:PATH"
          New-Item -ItemType Directory -Force -Path out/parity | Out-Null
          $commands = 'call "{0}" && cmake --preset x64-debug -DMWG_WINDOWS_SDK={1}' -f $vcvars,$env:MWG_WINDOWS_SDK
          & $env:ComSpec /d /s /c $commands
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build CMake preset
        id: build
        shell: pwsh
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $vsPath = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vsPath) { throw 'Visual Studio C++ tools were not found.' }
          $vcvars = Join-Path $vsPath 'VC\Auxiliary\Build\vcvars64.bat'
          $ninja = Join-Path $vsPath 'Common7\IDE\CommonExtensions\Microsoft\CMake\Ninja'
          $env:PATH = "$ninja;$env:PATH"
          $commands = 'call "{0}" && cmake --build --preset x64-debug -- -v > out\parity\cmake-Debug-x64.log 2>&1' -f $vcvars
          & $env:ComSpec /d /s /c $commands
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Check CMake/MSBuild parity
        shell: pwsh
        run: |
          pwsh -File build/scripts/Compare-CompileCommands.ps1 `
            -CMakeBuildDir out/b/x64d `
            -CMakeBuildLog out/parity/cmake-Debug-x64.log `
            -FailOnLostFlags `
            -FailOnNewWarnings

  cmake-vs-debug-x64:
    needs: vcpkg-deps-x64-tests
    if: ${{ !cancelled() }}
    permissions:
      contents: read
    uses: ./.github/workflows/cmake-vs.yml
    with:
      platform: x64
      configuration: Debug

  cmake-vs-debug-win32:
    needs: vcpkg-deps-win32-tests
    if: ${{ !cancelled() }}
    permissions:
      contents: read
    uses: ./.github/workflows/cmake-vs.yml
    with:
      platform: Win32
      configuration: Debug

  cmake-vs-release-x64:
    needs: vcpkg-deps-x64-release-full
    if: ${{ !cancelled() }}
    permissions:
      contents: read
    uses: ./.github/workflows/cmake-vs.yml
    with:
      platform: x64
      configuration: Release

  cmake-vs-release-win32:
    needs: vcpkg-deps-win32-release-full
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
    uses: ./.github/workflows/cmake-vs.yml
    with:
      platform: Win32
      configuration: Release

  build-debug-x64:
    needs: vcpkg-deps-x64-tests
    if: ${{ !cancelled() }}
    permissions:
      contents: read
    uses: ./.github/workflows/build-msbuild.yml
    with:
      platform: x64
      configuration: Debug

  build-debug-win32:
    needs: vcpkg-deps-win32-tests
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
    uses: ./.github/workflows/build-msbuild.yml
    with:
      platform: Win32
      configuration: Debug

  build-release-x64:
    needs: vcpkg-deps-x64-release-full
    if: ${{ !cancelled() }}
    permissions:
      contents: read
    uses: ./.github/workflows/build-msbuild.yml
    with:
      platform: x64
      configuration: Release

  build-release-win32:
    needs: vcpkg-deps-win32-release-full
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
    uses: ./.github/workflows/build-msbuild.yml
    with:
      platform: Win32
      configuration: Release
